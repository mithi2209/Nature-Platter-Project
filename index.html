<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Platter</title>

    <!-- CSS Link -->

<body class="font-sora">

            <div>
                <img class="w-[70%] md:w-[90%] lg:w-full" src="./assets/nav-logo.png" alt="">
            </div>

            <ul class="hidden md:hidden lg:flex items-center text-[#111111] text-xl gap-8">
                <li><a href="">Product</a></li>
                <li><a href="">Services</a></li>
                <li><a href="">Contact us</a></li>
            </ul>

                <a class="text-xl" href=""><i class="fa-solid fa-cart-shopping"></i></a>

                </button>

                    Register
                </button>

            </div>

            <!-- Hamburger Menu -->
            <div class="block md:hidden">
                <i class="fa-solid fa-bars text-2xl text-[#179800]"></i>
            </div>

        </nav>

        <hr class=" border-[#179800] block lg:hidden "></hr>

            <div class="pt-12 md:pt-16 lg:pt-28">

                <h1 class="mx-auto text-[#111111] text-3xl md:text-[42px] lg:text-[56px] font-semibold text-center leading-10 md:leading-14 lg:leading-20 ">
                    Freshness<span class="text-[#179800]">

                <p class="mx-auto mt-4 md:mt-5 lg:mt-8 w-[90%] md:w-[60%] lg:w-[28%] text-base md:text-xl text-[#4D5558] text-center">

                </p>

            </div>

            <div class="pt-6 md:pt-9 grid items-center justify-center">
                <img class="hidden md:block" src="./assets/Hero Section 1.png" alt="">
                <img class="block md:hidden lg:hidden" src="./assets/Hero Section-large.png" alt="">
